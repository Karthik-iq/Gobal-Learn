<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="capShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded tile background -->
  <rect width="64" height="64" rx="16" fill="url(#gpGrad)"/>
  
  <!-- Stylized Education / Overseas Globe -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 3)">
    <!-- Globe Circle -->
    <circle cx="32" cy="32" r="16.5" stroke-width="3"/>
    
    <!-- Equator -->
    <line x1="15.5" y1="32" x2="48.5" y2="32" stroke-width="2.4"/>
    
    <!-- Meridian Ellipse -->
    <ellipse cx="32" cy="32" rx="7.5" ry="16.5" stroke-width="2.4"/>
    
    <!-- North Latitude Arc -->
    <path d="M20 22 C 24 25, 40 25, 44 22" stroke-width="2"/>
    
    <!-- South Latitude Arc -->
    <path d="M20 42 C 24 39, 40 39, 44 42" stroke-width="2"/>
  </g>
  
  <!-- Graduation Cap (Education Symbol) -->
  <g filter="url(#capShadow)">
    <!-- Diamond Mortarboard Top -->
    <polygon points="32,9 50,16 32,23 14,16" fill="#ffffff"/>
    <!-- Skullcap Base -->
    <path d="M22,19.5 L22,23.5 C22,27.5 42,27.5 42,23.5 L42,19.5 Z" fill="#ffffff"/>
    <!-- Golden Tassel Cord & Bead -->
    <path d="M47,17.2 L49.5,25.5" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="49.5" cy="27" r="1.8" fill="#f59e0b"/>
  </g>
</svg>